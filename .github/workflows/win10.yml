# Windows 10 Remote Node Definition
win10-target-node:
  nodename: win10-target-node
  hostname: 192.168.1.50                 # Replace with your Windows 10 IP address or FQDN
  osFamily: windows
  osName: Windows 10
  description: "Remote Windows 10 Workstation managed via GitHub Resource Model"
  tags: windows, desktop
  username: Administrator               # Target Windows local or domain user
  
  # WinRM Node Executor Settings
  node-executor: WinRMPython
  file-copier: WinRMcpPython
  winrm-auth-type: basic                # Options: basic, ntlm, kerberos
  winrm-protocol: http                  # Options: http (port 5985) or https (port 5986)
  winrm-port: 5985
  winrm-ssl: false
  winrm-certificate-check: false
  
  # Path to the password in Rundeck's Key Storage
  winrm-password-storage-path: keys/project/windows-password
